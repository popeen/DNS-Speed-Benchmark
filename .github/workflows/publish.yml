name: Build and publish Windows app

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows executable
        run: >
          dotnet publish DnsSpeedBench.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DnsSpeedBench-win-x64
          path: publish/DnsSpeedBench.exe
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DNS SpeedBench build ${{ github.run_number }}
          generate_release_notes: true
          files: publish/DnsSpeedBench.exe
